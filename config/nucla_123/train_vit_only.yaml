work_dir: ./work_dir/nucla_123/vit_only

# Feeder (giống ResNet)
feeder: feeder.feeder_rgb_only.Feeder
train_feeder_args:
  rgb_path: /duong/dan/den/folder/anh_ST_roi_cua_ban/
  label_path: train
  random_flip: True
  temporal_rgb_frames: 5

test_feeder_args:
  rgb_path: /duong/dan/den/folder/anh_ST_roi_cua_ban/
  label_path: val
  temporal_rgb_frames: 5

# Model ViT-B/16
model: net.vit_only.Model
model_args:
  num_class: 10
  pretrained: True

# Training - ViT cần LR nhỏ hơn và dùng Adam
device: [0]
batch_size: 16
test_batch_size: 16
optimizer: Adam
base_lr: 0.001
step: [20, 40]
num_epoch: 50
eval_interval: 1
